<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Faro - Iniciar Sesión</title>
    <link rel="stylesheet" href="../CSS/index.css">
</head>

<body>

    <div class="login-card">

        <div class="header-illustration">

            <img src="https://static.vecteezy.com/system/resources/previews/035/597/679/non_2x/old-and-young-men-sitting-together-talking-older-and-younger-male-generation-with-speech-bubbles-engaged-in-conversation-illustration-vector.jpg"
                alt="Ilustración El Faro" class="illustration">
        </div>


        <div class="login-content">
            <p class="welcome-text">
                Te damos la bienvenida a <strong>“El faro“</strong> tu refugio digital.<br>
                Conecta con otros, comparte sabiduría y encuentra paz en un espacio diseñado para tu bienestar
                emocional. Aquí, cada voz cuenta y cada mente importa.<br>
                Únete a nuestra comunidad.
            </p>

            <form class="login-form">
                <input type="email" placeholder="Correo electronico" id= "Correo electronico" required> 
                <input type="password" placeholder="Contraseña" id= "Contraseña"33 required>
                <button type="submit" class="btn-submit" id="btnGuardar"
                >Iniciar Sesión</button>
            </form>

            <div class="login-links">
                <a href="#">¿Olvidaste tu contraseña?</a>
                <a href="#">¿No tienes cuenta? ¡Regístrate!</a>
            </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../JAVA/index.js"></script>

</body>
</html>
