<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Faro - Dashboard</title>
    <link rel="stylesheet" href="../CSS/lobby.css">
</head>
<body>

    <div class="dashboard-container">
        
    
        <header class="main-header">
            <h1 class="logo-title">EL FARO</h1>
            <div class="user-info">
                <span>David Mauricio Arroyave</span>
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTgWLtgJhtdUsqqaYFD2wdwgMsDVnTAOGSMcUiYPEzxx6WeFmnwO5-HLl4&s=10" alt="Avatar" class="user-avatar">
            </div>
        </header>

        
        <div class="dashboard-body">
            
            
            <aside class="sidebar">
                <h2>Categorías</h2>
                <ul class="category-list">
                    <li><a>Amor</a></li>
                    <li><a>Familia</a></li>
                    <li><a>Duelo</a></li>
                    <li><a>Academico</a></li>
                    <li class="active"></li>
                </ul>
            </aside>

            
            <main class="content-area">
                
                
                <button class="btn-create"> <a href="https://meet.google.com/home"> Crear Nueva + </a></button> 

                
                <div class="cards-grid">
                    
                    
                    <div class="card">
                        <div class="card-inner">
                            <p><strong>Nombre:</strong> class="card-link">Yeison Amaya</p>
                            <p><strong>Hora:</strong> 4:30 pm - 7:00 pm</p>
                            <p><strong>Estado:</strong> Publica</p>
                        </div>
                        <span class="card-theme">Tema: Adicciones</span>
                    </div>

                    
                    <div class="card">
                        <div class="card-inner">
                            <p><strong>Nombre:</strong> class="card-link">Pedro de Janeiro</p>
                            <p><strong>Hora:</strong> 4:30 pm - 7:00 pm</p>
                            <p><strong>Estado:</strong> Publica</p>
                        </div>
                        <span class="card-theme">Tema: Adicciones</span>
                    </div>

                </div>
            </main>

        </div>
    </div>

</body>
</html>
